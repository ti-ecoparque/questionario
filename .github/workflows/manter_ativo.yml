name: Manter App Streamlit Ativo

on:
  schedule:
    # Executa a cada 10 horas automaticamente
    - cron: '0 */10 * * *'
  workflow_dispatch: # Permite rodar manualmente se quiser

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Criar Commit Vazio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Ajuste automático para evitar hibernação"
          git push